<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SangeetFit — logo</title>
<style>
  @font-face { font-family: "BodoniModa"; src: url("/Users/nitz/Code_Stuff/SAeCo/public/fonts/bodoni-moda/BodoniModa-Regular.ttf") format("truetype"); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #FBF7F1; color: #241016; font-family: ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .sheet { width: 1180px; padding: 52px 60px 46px; }
  .kicker { font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: #8A7B76; }
  h1 { font-family: "BodoniModa", Georgia, serif; font-size: 46px; font-weight: 400; margin: 12px 0 0; letter-spacing: -0.01em; }
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 34px; margin-top: 34px; align-items: center; }
  .card { background: #FFFDFA; border: 1px solid #EDE4DA; padding: 26px; }
  .dark { background: #5B1730; border: none; display: flex; align-items: center; justify-content: center; gap: 34px; padding: 30px; }
  .row-label { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: #8A7B76; margin-bottom: 10px; }
  .word img { width: 100%; max-width: 620px; display: block; }
  .lockup img { width: 100%; max-width: 560px; display: block; }
  .sizes { display: flex; align-items: flex-end; gap: 26px; margin-top: 8px; }
  .size { text-align: center; font-size: 10px; letter-spacing: .16em; color: #8A7B76; }
  .size img { display: block; margin: 0 auto 8px; }
  .header { background: #FCF8F6; border: 1px solid #E7DCD2; display: flex; align-items: center; justify-content: space-between; padding: 16px 30px; }
  .header img { height: 34px; display: block; }
  .nav { display: flex; gap: 26px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #6B5A57; }
  .nav b { color: #5B1730; }
  .foot { margin-top: 30px; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #8A7B76; }
</style>
</head>
<body>
<div class="sheet">
  <div class="kicker">SangeetFit · logo · 25 October 2026</div>
  <h1>“S”, drawn from the face.</h1>

  <div class="grid">
    <div>
      <div class="row-label">Symbol</div>
      <div class="card"><img src="symbol.svg" width="230" height="230" alt="SangeetFit symbol" /></div>
    </div>
    <div>
      <div class="row-label">On burgundy · app icon</div>
      <div class="dark">
        <img src="symbol-ivory.svg" width="130" height="130" alt="" />
        <img src="app-icon.svg" width="112" height="112" alt="" />
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="row-label">Wordmark</div>
    <div class="word"><img src="wordmark.svg" alt="SangeetFit wordmark" /></div>
  </div>

  <div class="grid">
    <div class="row-label">Lockup</div>
    <div class="lockup"><img src="lockup.svg" alt="SangeetFit logo" /></div>
  </div>

  <div class="grid">
    <div class="row-label">Sizes</div>
    <div class="sizes">
      <div class="size"><img src="symbol.svg" width="88" height="88" alt="" />88</div>
      <div class="size"><img src="symbol.svg" width="56" height="56" alt="" />56</div>
      <div class="size"><img src="symbol.svg" width="40" height="40" alt="" />40 header</div>
      <div class="size"><img src="symbol-small.svg" width="32" height="32" alt="" />32</div>
      <div class="size"><img src="symbol-small.svg" width="24" height="24" alt="" />24</div>
      <div class="size"><img src="symbol-small.svg" width="16" height="16" alt="" />16 tab</div>
      <div class="size"><img src="app-icon.svg" width="16" height="16" alt="" />16 icon</div>
    </div>
  </div>

  <div class="grid">
    <div class="row-label">In the header</div>
    <div class="header">
      <img src="lockup.svg" alt="SangeetFit" />
      <div class="nav"><b>For you</b><span>Explore</span><span>My clothes</span></div>
    </div>
  </div>

  <div class="foot"><span>Burgundy #5B1730 · gold #B08D4F · ivory #F7F1E5</span><span>outlined vectors · no live text</span></div>
</div>
</body>
</html>
