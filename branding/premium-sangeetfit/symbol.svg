<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SangeetFit drape S symbol for light backgrounds">
  <title>SangeetFit drape S</title>
  <!-- 
    Iteration on Direction II (Dupatta) from 25 Oct 2026 premium round.
    
    Original: one hairline drape that resolved into an S but became 
    a squiggle at 16 px. This iteration gives the fabric fold a 
    Didone high-contrast treatment: a bold outer stroke for presence 
    at all sizes, with an inner fine line for couture refinement.
    
    The form traces fabric falling from a shoulder, folding back on 
    itself to create the S silhouette — staying true to the product 
    story (Indian wedding wardrobe) while being ownable.
    
    Gold dot = the rhythm note, consistent with the Oct 2026 signature.
    
    Palette: Burgundy #5B1730 · Gold #B08D4F
  -->
  <g transform="translate(128 128) rotate(-8) translate(-128 -128)">
    <!-- Main drape S — bold, clear silhouette at any size -->
    <path d="M176 30 
             C200 30 214 46 214 68 
             C214 90 196 104 172 104 
             C138 104 108 80 88 64
             C68 48 46 38 30 44
             C14 50 10 68 14 86
             C18 104 38 118 64 134
             C90 150 126 170 146 196
             C160 214 160 234 144 240
             C128 246 108 240 92 228
             C76 216 64 198 54 184"
          fill="none" stroke="#5B1730" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner fine line for Didone contrast (thin/thick) -->
    <path d="M176 36 
             C196 36 206 50 206 68 
             C206 86 190 98 172 98 
             C142 98 114 76 94 62
             C74 48 52 42 38 48
             C24 54 18 68 22 86
             C26 104 44 116 68 130
             C92 144 126 162 142 186
             C152 200 152 224 140 230
             C128 236 110 232 96 222
             C82 212 70 196 60 184"
          fill="none" stroke="#5B1730" stroke-width="1.6" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Gold beat dot — the rhythm signature -->
  <circle cx="14" cy="86" r="4" fill="#B08D4F"/>
</svg>
