<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="SangeetFit symbol — marigold disc with dupatta sweep">
  <!-- Marigold disc: the sangeet celebration circle. Flat color: identity must not depend on gradients. -->
  <circle cx="60" cy="60" r="50" fill="#E4A33C"/>
  <!-- Dupatta-sweep cut: negative-space drape that reads as the personal "fit". Softer marigold-dark #B4752F = the symbol's own shade token. -->
  <path d="M 60 10
           C 74 10 88 22 88 38
           C 88 57 70 61 60 61
           C 51 61 44 65 44 73
           C 44 82 52 88 60 88
           C 74 88 86 77 86 77"
        fill="none" stroke="#B4752F" stroke-width="14" stroke-linecap="round" opacity="0.78"/>
</svg>
