name: Verify mock release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MOCK_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      REQUIRE_REDIS_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - id: verify
        run: npm run verify
        env:
          TEST_REDIS_CONTAINER: ${{ job.services.redis.id }}
          TMPDIR: ${{ runner.temp }}
